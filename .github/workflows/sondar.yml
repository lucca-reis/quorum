name: Sondar e-Cidadania (temporário)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sondar.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://www12.senado.leg.br/ecidadania
          UA='Mozilla/5.0 (X11; Linux x86_64) quorum'
          for q in "" "?p=2" "?p=78" "?fechada=on" "?tipo=PEC"; do n=$(echo "lista$q" | tr -c 'a-zA-Z0-9\n' _); curl -sSL -A "$UA" "$B/pesquisamateria$q" -o "$n.html" -w "$q %{http_code}\n"; sleep 1; done
          curl -sSL -A "$UA" "$B/visualizacaomateria?id=164123" -o mat2.html; sleep 1
          curl -sSL -A "$UA" "$B/comofuncionaconsultapublica" -o como.html
          git init -q; git checkout -qb sonda; git add -A
          git -c user.name=robo -c user.email=robo@x commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sonda
