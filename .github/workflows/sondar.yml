name: Sondar fontes de tribunais e ministérios (temporário)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sondar.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; cd out
          UA='Mozilla/5.0 (X11; Linux x86_64) quorum'
          probe(){ n=$1; u=$2; curl -sSL -m 40 -A "$UA" -o "$n.txt" -w "$n %{http_code} %{size_download} %{content_type} %{url_effective}\n" "$u" >> log.out 2>>log.out || echo "$n FAIL" >> log.out; }
          probe minlist "https://www.gov.br/pt-br/orgaos-do-governo/ministerios-e-orgaos-com-status-de-ministerios"
          probe stj-not "https://www.stj.jus.br/sites/portalp/Comunicacao/Ultimas-noticias"
          probe gn-tse "https://news.google.com/rss/search?q=site:tse.jus.br&hl=pt-BR&gl=BR&ceid=BR:pt-419"
          probe gn-tst "https://news.google.com/rss/search?q=site:tst.jus.br&hl=pt-BR&gl=BR&ceid=BR:pt-419"
          probe gn-stm "https://news.google.com/rss/search?q=site:stm.jus.br&hl=pt-BR&gl=BR&ceid=BR:pt-419"
          probe gn-stj "https://news.google.com/rss/search?q=site:stj.jus.br&hl=pt-BR&gl=BR&ceid=BR:pt-419"
          probe eag-readme "https://raw.githubusercontent.com/cgugovbr/eagendas-publico/main/api-consulta/README.md"
          probe cnj-rss "https://www.cnj.jus.br/feed/"
          probe abr-just "https://agenciabrasil.ebc.com.br/rss/justica/feed.xml"
          cp minlist.txt minlist.html; cp stj-not.txt stj.html; cp eag-readme.txt eag.md; cp gn-tse.txt gn-tse.xml; cp gn-tst.txt gn-tst.xml
          for f in *.txt; do echo "=== $f"; grep -oiE '(href|src)="[^"]*(rss|feed|xml|api)[^"]*"' "$f" | sort -u | head -15; head -c 400 "$f" | tr '\n' ' '; echo; done >> log.out
          rm -f *.txt
          git init -q; git checkout -qb sonda; git add log.out minlist.html stj.html eag.md gn-tse.xml gn-tst.xml
          git -c user.name=robo -c user.email=robo@x commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sonda
