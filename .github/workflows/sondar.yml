name: Sondar fontes de tribunais e ministérios (temporário)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sondar.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          UA='Mozilla/5.0 (X11; Linux x86_64) quorum'
          probe(){ n=$1; u=$2; curl -sSL -m 40 -A "$UA" -o "$n.txt" -w "$n %{http_code} %{size_download} %{content_type} %{url_effective}\n" "$u" >> log.txt 2>>log.txt || echo "$n FAIL" >> log.txt; }
          probe stj-rss "https://www.stj.jus.br/sites/portalp/Paginas/Comunicacao/Noticias/RSS.aspx"
          probe stj-not "https://www.stj.jus.br/sites/portalp/Comunicacao/Ultimas-noticias"
          probe tst-not "https://www.tst.jus.br/noticias"
          probe tst-rss "https://www.tst.jus.br/rss"
          probe tse-not "https://www.tse.jus.br/comunicacao/noticias"
          probe tse-rss "https://www.tse.jus.br/comunicacao/noticias/RSS"
          probe stm-not "https://www.stm.jus.br/informacao/agencia-de-noticias"
          probe stm-rss "https://www.stm.jus.br/rss"
          probe saude-rss "https://www.gov.br/saude/pt-br/assuntos/noticias/RSS"
          probe saude-not "https://www.gov.br/saude/pt-br/assuntos/noticias"
          probe agenciagov "https://agenciagov.ebc.com.br/noticias/RSS"
          probe eagendas "https://eagendas.cgu.gov.br/"
          probe eagendas-api "https://eagendas.cgu.gov.br/api/v1/orgaos"
          probe planalto-min "https://www.gov.br/planalto/pt-br/conheca-a-presidencia/ministerios"
          probe govbr-orgaos "https://www.gov.br/pt-br/orgaos-do-governo"
          for f in *.txt; do echo "=== $f"; grep -oiE '(href|src)="[^"]*(rss|feed|xml|api)[^"]*"' "$f" | sort -u | head -15; head -c 400 "$f" | tr '\n' ' '; echo; done >> log.txt
          rm -f *.txt
          git init -q; git checkout -qb sonda; git add log.txt
          git -c user.name=robo -c user.email=robo@x commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sonda
