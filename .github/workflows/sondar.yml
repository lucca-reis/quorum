name: Sondar e-Cidadania (temporário)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sondar.yml']
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://www12.senado.leg.br/ecidadania
          UA='Mozilla/5.0 (X11; Linux x86_64) quorum'
          A=https://legis.senado.leg.br/dadosabertos
          for u in "processo?codigoMateria=175871" "materia/175871.json" "processo?tramitando=S&v=1" "processo?tramitando=S&sigla=PEC"; do n=$(echo "$u" | tr -c 'a-zA-Z0-9\n' _); curl -sSL -H 'Accept: application/json' -A "$UA" "$A/$u" -o "$n.json" -w "$u %{http_code} %{size_download}\n" -m 120; sleep 1; done
          ls -la
          git init -q; git checkout -qb sonda; git add -A
          git -c user.name=robo -c user.email=robo@x commit -qm sonda
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sonda
