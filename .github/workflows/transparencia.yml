name: Transparência (cota parlamentar)

on:
  schedule:
    - cron: '23 10 * * *'   # todo dia às 7h23 de Brasília, depois que Câmara e Senado publicam
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/transparencia.py', '.github/workflows/transparencia.yml']

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  transparencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar gastos da cota parlamentar
        run: python scripts/transparencia.py
      - name: Salvar se mudou
        run: |
          git config user.name "quorum-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/transparencia
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Transparência atualizada $(TZ=America/Sao_Paulo date '+%d/%m')"
          git pull --rebase origin main
          git push
