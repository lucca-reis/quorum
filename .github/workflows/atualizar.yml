name: Atualizar dados

on:
  schedule:
    - cron: '7 * * * *'   # de hora em hora, no minuto 7
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar sessões da Câmara e do Senado
        run: python scripts/atualizar.py
      - name: Notícias oficiais de tribunais superiores e ministérios
        run: python scripts/instituicoes.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Buscar consultas públicas do e-Cidadania
        run: python scripts/consultas.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Salvar se mudou
        run: |
          git config user.name "quorum-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Dados atualizados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase origin main
          git push
