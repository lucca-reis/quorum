<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quorum: pautas, votações e composição do Congresso, do Supremo e da Presidência.">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Quorum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one drawing board centered in the viewport. Opening a house moves it to its own edge. */
:root{
  --bg:#FAFAF7;
  --ink:#121417;
  --nc:#B9BBB6;
  --muted:#6B6F74;
  --rule:#DCDDD8;
  --soft:#EEEEE9;
  --display:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0F1113;--ink:#ECEDE8;--nc:#4E5256;--muted:#9A9E9F;--rule:#2A2D30;--soft:#1B1E21;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1113;--ink:#ECEDE8;--nc:#4E5256;--muted:#9A9E9F;--rule:#2A2D30;--soft:#1B1E21;color-scheme:dark}
/* colour schemes picked from the dots in the bottom-right corner: background · ink */
:root{--ring:transparent;--menu-h:56px}
:root[data-scheme]{--muted:color-mix(in srgb, var(--ink) 62%, var(--bg));--rule:color-mix(in srgb, var(--ink) 22%, var(--bg));--soft:color-mix(in srgb, var(--ink) 9%, var(--bg));--nc:color-mix(in srgb, var(--ink) 35%, var(--bg))}
:root[data-scheme="branco-preto"]{--bg:#FAFAF7;--ink:#121417;color-scheme:light}
:root[data-scheme="preto-branco"]{--bg:#0F1113;--ink:#F4F4EF;color-scheme:dark}
:root[data-scheme="verde-amarelo"]{--bg:#007A33;--ink:#FFD500;--ring:#FFD500;color-scheme:dark}
:root[data-scheme="branco-vermelho"]{--bg:#FFFFFF;--ink:#C8102E;--ring:#C8102E;color-scheme:light}

html,body{height:100%;background:var(--bg);color:var(--ink)}
body{box-sizing:border-box;display:grid;place-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(var(--menu-h) + 8px) 16px}
.stage{width:100%;max-width:1400px;position:relative;font-family:var(--display)}
#plan{display:block;backface-visibility:hidden;width:100%;height:auto;max-height:calc(100vh - var(--menu-h) - 40px);overflow:visible}
#frame{fill:color-mix(in srgb, var(--ink) 6%, var(--bg));stroke:none;transition:opacity .45s}

.house{cursor:pointer;outline:none;transition:opacity .45s}
.shell{fill:var(--bg);stroke:none;transition:opacity .45s, transform .35s cubic-bezier(.3,.7,.3,1)}
.stage:not(.is-open) .house:hover .shell,
.house:focus-visible .shell{transform:scale(1.03)}
.arc{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.pres{fill:var(--ink)}
.seat{fill:var(--ink);transition:fill .35s ease, transform .18s ease, opacity .45s ease;transform-box:fill-box;transform-origin:center}

.stage.is-open #frame,.stage.is-open .house:not(.is-active){opacity:0;pointer-events:none}
.stage.is-open .house.is-active{cursor:default}
.stage.is-open .house.is-active .shell{fill:color-mix(in srgb, var(--ink) 6%, var(--bg));pointer-events:none}
.house.colored .seat{fill:var(--c)}
.house.colored .seat:hover,.house.colored .pres:hover{transform:scale(1.6)}
.pres{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}

/* house panel: title + agenda timeline */
.panel{display:flex;flex-direction:column;gap:clamp(14px,2.2vw,28px);min-width:0;opacity:0;transform:translateY(8px);transition:opacity .45s .3s, transform .45s .3s}
.panel.show{opacity:1;transform:none}
.panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(36px,5vw,76px);line-height:.95;letter-spacing:-.03em;text-wrap:balance}
.tl{list-style:none;margin:0;padding:0 6px 0 0;overflow:auto;min-height:0;flex:1;position:relative;scrollbar-width:thin}
.day{display:grid;grid-template-columns:5.6em 18px minmax(0,1fr);column-gap:14px;position:relative}
.day::before{content:"";position:absolute;left:calc(5.6em + 14px + 8px);top:0;bottom:0;width:1.5px;background:var(--rule)}
.day:first-child::before{top:12px}
.day:last-child::before{bottom:auto;height:12px}
.when{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:3px;line-height:1.35}
.when b{display:block;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.node{position:relative;z-index:1;width:12px;height:12px;margin:7px auto 0;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--bg)}
.day.future .node{background:var(--bg);border:1.5px solid var(--ink);box-sizing:border-box}
.day.today .node{width:16px;height:16px;margin-top:5px;background:var(--ink);box-shadow:0 0 0 4px var(--bg),0 0 0 5.5px var(--ink)}
.body{padding-bottom:26px;min-width:0}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kind{font-size:14px;font-weight:600}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.day.today .status{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.future .status{border-style:dashed;color:var(--ink)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;font-size:14.5px;line-height:1.4}
.item .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item .t{max-width:62ch}
.item .r{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.item .r::before{content:"→ ";color:var(--muted)}
.day.past .item .t{color:var(--muted)}
.src{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.src a{color:inherit}
@media (min-width:1000px){
  .panel{position:absolute;top:3%;bottom:3%}
  .stage.open-senado .panel{left:47%;right:3%}
  .stage.open-camara .panel{left:3%;right:53%}
}
@media (max-width:999px){ .panel{margin-top:20px} .tl{overflow:visible} }

/* party and person views: full-screen layers; the clicked sphere grows into place */
.house.colored .seat{cursor:pointer}
.seat.picked,.m-dot.picked{opacity:0}
.ov{position:fixed;inset:0;overflow:auto;font-family:var(--display);box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 72px) calc(env(safe-area-inset-bottom, 0px) + 48px)}
.ov[hidden]{display:none!important}
.ov::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:0;transition:opacity .45s;z-index:-1}
.ov.show::before{opacity:1}
.party{z-index:16}
.person{z-index:17;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2.4vw,28px);padding-top:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 6vh)}
.avatar{--D:clamp(120px,17vw,220px);width:var(--D);height:var(--D);flex:none;border-radius:50%;background:var(--c);overflow:hidden;transform-origin:0 0;transition:transform .6s cubic-bezier(.65,0,.35,1);cursor:pointer;display:grid;place-items:center}
.avatar:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.avatar .ph{font-size:calc(var(--D)*.3);font-weight:700;letter-spacing:-.02em;color:var(--on,#fff);opacity:.92;text-align:center;line-height:1}
.fade{opacity:0;transform:translateY(8px);transition:opacity .35s, transform .35s}
.ov.show .fade{opacity:1;transform:none;transition-delay:.4s}
.p-info{width:100%;max-width:920px;display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2vw,24px)}
.p-note{margin:0;max-width:62ch;font-size:14px;color:var(--muted);text-align:center}
.p-name{margin:0;font-weight:700;font-size:clamp(28px,3.6vw,52px);letter-spacing:-.03em;line-height:1;text-align:center;text-wrap:balance}
.p-meta{margin:6px 0 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.p-meta .dot{width:9px;height:9px;border-radius:50%;background:var(--c);align-self:center}
.p-grid{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.p-grid section{background:var(--bg);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.p-grid h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.empty{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.ov-back{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:none;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.ov-back:hover{background:var(--ink);color:var(--bg)}
.ov-back:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.person .ov-back{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 20px);left:max(16px, env(safe-area-inset-left, 0px));z-index:1}

/* party view */
.pv{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(24px,4vw,44px)}
.pv-head{display:flex;align-items:center;gap:clamp(18px,3vw,36px);flex-wrap:wrap}
.pv-head .avatar{--D:clamp(96px,11vw,150px)}
.pv-title{display:flex;flex-direction:column;gap:6px;min-width:0}
.pv-title h2{margin:0;font-weight:700;font-size:clamp(44px,7vw,96px);letter-spacing:-.04em;line-height:.9}
.pv-title .full{margin:0;font-size:clamp(16px,1.6vw,20px);color:var(--muted)}
.pv-counts{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
.pv-counts div{display:flex;flex-direction:column}
.pv-counts b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.pv-counts span{font-size:13px;color:var(--muted)}
.pv-house{display:flex;flex-direction:column;gap:18px}
.pv-house > h3{margin:0;padding-bottom:10px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:-.01em}
.pv-house > h3 small{font-size:14px;font-weight:400;color:var(--muted)}
.pv-empty{margin:0;color:var(--muted);font-size:15px}
.uf{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:12px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.uf > span{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding-top:9px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 12px}
.member{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:14.5px;line-height:1.25}
.member:hover{background:var(--soft)}
.member:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.m-dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.m-name{min-width:0;overflow-wrap:anywhere}
.m-v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.member.ex{grid-template-columns:14px minmax(0,1fr);row-gap:1px}
.member.ex .m-v{grid-column:2}
@media (max-width:720px){ .p-grid{grid-template-columns:minmax(0,1fr)} }

/* timeline items that open a project page */
.item-link{display:grid;gap:2px;color:inherit;text-decoration:none;border-radius:4px;margin:-4px -6px;padding:4px 6px}
.item-link:hover{background:var(--soft)}
.item-link:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.item-link:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

/* project page */
.proj{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;font-family:var(--display);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 72px) calc(env(safe-area-inset-bottom, 0px) + 48px);
  opacity:0;transition:opacity .3s}
.proj.show{opacity:1}
.proj[hidden]{display:none!important}
.pj{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pj-card{display:flex;flex-direction:column;gap:clamp(24px,3.6vw,40px);padding:clamp(20px,3.6vw,44px);border-radius:clamp(22px,2.6vw,32px);background:color-mix(in srgb, var(--ink) 5%, var(--bg))}
.pj-head{display:flex;flex-direction:column;gap:8px}
.pj-head p{margin:0}
.pj-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pj-card.is-live .c-pill{color:#E0242B}
.pj-card.is-live .c-dot{background:#E0242B;animation:lvp 1.6s ease-in-out infinite}
.pj-what{font-size:clamp(16px,1.5vw,18px);line-height:1.4}
.pj-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pj-back{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:none;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.pj-back:hover{background:var(--ink);color:var(--bg)}
.pj-back:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pj-house{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pj-code{font-size:14px;color:var(--muted)}
.pj-title{margin:8px 0 2px;font-weight:500;font-size:clamp(30px,4.2vw,54px);line-height:1.04;letter-spacing:-.025em;text-wrap:balance;max-width:20ch}
.pj-status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:14px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px}
.pj-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.pj-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.pj-main,.pj-side{display:flex;flex-direction:column;gap:32px;min-width:0}
.pj h3{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--muted)}
.pj-lede{margin:0;font-size:clamp(18px,1.9vw,22px);line-height:1.45;max-width:58ch;text-wrap:pretty}
.pj-points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-width:62ch}
.pj-points li{position:relative;padding-left:20px;font-size:15.5px;line-height:1.5}
.pj-points li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.pj-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pj-steps li{display:grid;grid-template-columns:7.5em 14px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:14px;font-size:15px;line-height:1.4}
.pj-steps li::before{content:"";position:absolute;left:calc(7.5em + 12px + 6px);top:6px;bottom:-6px;width:1.5px;background:var(--rule)}
.pj-steps li:last-child::before{display:none}
.pj-steps time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.pj-steps i{width:10px;height:10px;margin:5px auto 0;border-radius:50%;background:var(--ink);position:relative;z-index:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 5%, var(--bg))}
.pj-steps li.future i{background:color-mix(in srgb, var(--ink) 5%, var(--bg));border:1.5px solid var(--ink);box-sizing:border-box}
.pj-steps li.future span{color:var(--muted)}
.pj-vote{background:var(--bg);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.pj-vote .lbl{font-size:13px;color:var(--muted)}
.pj-vote .res{font-size:22px;font-weight:700;letter-spacing:-.01em}
.tally{display:flex;flex-direction:column;gap:10px}
.tally-row{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.tally-bar{display:flex;height:10px;background:var(--soft)}
.tally-bar .y{background:var(--ink)}
.tally-bar .n{background:var(--muted)}
.tally-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pj-vote .note,.pj-none{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.pj-facts{margin:0;display:flex;flex-direction:column;gap:14px}
.pj-facts dt{font-size:13px;color:var(--muted)}
.pj-facts dd{margin:2px 0 0;font-size:15px;line-height:1.4}
.pj-links{list-style:none;margin:0;padding:4px 16px;display:flex;flex-direction:column;background:var(--bg);border-radius:18px}
.pj-links li + li{border-top:1px solid var(--rule)}
.pj-links a{display:flex;justify-content:space-between;gap:12px;padding:11px 0;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.35}
.pj-links a::after{content:"↗";color:var(--muted)}
.pj-links a:hover{text-decoration:underline;text-underline-offset:3px}
.pj-src{list-style:decimal;margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
.pj-src a{color:var(--ink);text-underline-offset:3px}
.pj-src li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.pj-rel a{color:var(--ink);font-size:15px}
@media (max-width:820px){ .pj-grid{grid-template-columns:minmax(0,1fr)} }

/* "i" info toggle that holds the sources */
.info{position:relative;display:inline-block;flex:none}
.info summary{list-style:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;line-height:1;cursor:pointer;color:var(--ink);user-select:none}
.info summary::-webkit-details-marker{display:none}
.info summary:hover,.info[open] summary{background:var(--ink);color:var(--bg)}
.info summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.info-pop{position:absolute;z-index:30;top:calc(100% + 8px);right:0;width:min(340px,80vw);background:var(--bg);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:14px 16px;text-align:left;font-family:var(--display)}
.info-h{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info-note{margin:0 0 10px;font-size:13px;color:var(--muted)}
.info-pop ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.4}
.info-pop li::marker{color:var(--muted)}
.info-pop a{color:var(--ink);text-underline-offset:3px}
.live{border:1.5px solid var(--ink);border-radius:10px;padding:14px 16px;margin:18px 0 6px;font-family:var(--display);display:flex;flex-direction:column;gap:6px}
.live:not(.on){border-color:var(--rule)}
.live p{margin:0}
.lv-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.lv-t{font-size:14px;line-height:1.4;color:var(--muted)}
.lv-video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;margin:6px 0 2px;border-radius:6px;overflow:hidden;background:var(--soft)}
.lv-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lv-links{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:4px}
.lv-go{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-size:14px;padding:8px 14px;border-radius:999px}
.live:not(.on) .lv-go{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.lv-go:focus-visible,.lv-alt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lv-alt{font-size:14px;color:var(--ink);text-underline-offset:3px}
.lv-dot{width:8px;height:8px;border-radius:50%;background:#E0242B;flex:none;display:inline-block;animation:lvp 1.6s ease-in-out infinite}
.lv-dot.off{background:var(--muted);animation:none}
@keyframes lvp{50%{opacity:.35}}
.lv-tag{display:inline-flex;align-items:center;gap:5px;margin-left:8px;color:#E0242B;font-weight:600}
.lv-tag .lv-dot{width:6px;height:6px}

.back-arrow{position:fixed;z-index:25;top:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 12px);left:max(16px, env(safe-area-inset-left, 0px));width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}

/* top menu: name on the left, the four powers in a soft segmented control in the middle, calendar icon on the right */
.menu{position:fixed;z-index:27;top:0;left:0;right:0;height:var(--menu-h);box-sizing:content-box;padding-top:env(safe-area-inset-top, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;column-gap:clamp(24px,4vw,64px);background:var(--bg);font-family:var(--display);font-weight:400;font-size:14px;transition:background-color .35s}
.menu a{color:var(--ink);text-decoration:none;white-space:nowrap}
.brand-wrap{justify-self:start;display:flex;align-items:baseline;gap:10px;min-width:0}

.today-date{font-size:14px;color:var(--muted);white-space:nowrap}
.menu nav{grid-column:2;grid-row:1;justify-self:stretch;margin-right:50px;display:flex;gap:2px;padding:3px;border-radius:999px;background:transparent;overflow-x:auto;scrollbar-width:none;max-width:100%}
.menu nav a{flex:1 1 0;text-align:center;padding:7px 10px;border-radius:999px;color:color-mix(in srgb, var(--ink) 72%, var(--bg));transition:background-color .2s, color .2s, box-shadow .2s}
.menu nav a:hover{color:var(--ink)}
.menu nav a:hover{background:color-mix(in srgb, var(--ink) 5%, var(--bg))}
.menu nav a[aria-current="page"]{background:color-mix(in srgb, var(--ink) 8%, var(--bg));color:var(--ink)}
.menu .cal-link{grid-column:2;grid-row:1;justify-self:end;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;transition:background-color .2s}
.menu .cal-link:hover{background:color-mix(in srgb, var(--ink) 6%, var(--bg))}
.menu .cal-link[aria-current="page"]{background:var(--ink);color:var(--bg)}
.menu a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.menu .brand:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
@media (max-width:1180px){ .menu nav .long{display:none} }
@media (max-width:1000px){ .menu nav a{padding:7px 4px;font-size:13px} .menu nav{margin-right:46px} }
@media (max-width:760px){
  :root{--menu-h:96px}
  .menu{grid-template-columns:1fr auto;grid-template-rows:auto auto;row-gap:8px;column-gap:12px;align-content:center}
  .menu nav{margin-right:0}
  .today-date{font-size:13px}
  .menu .brand{font-size:17px}
  .menu nav{grid-column:1 / -1;grid-row:2;justify-self:stretch}
  .menu nav a{padding:7px 4px;flex:1 1 0;text-align:center;font-size:13.5px}
  .menu nav .long{display:none}
  .menu .cal-link{grid-column:2;grid-row:1}
}

/* calendar page */
.cal{z-index:19}
.cw{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(28px,4vw,48px)}
.cw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 32px;flex-wrap:wrap}
.cw-head h1{margin:0;font-weight:700;font-size:clamp(44px,7vw,96px);letter-spacing:-.04em;line-height:.9}
.cw-tools{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.yr{display:flex;align-items:center;gap:6px}
.yr button{all:unset;box-sizing:border-box;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.yr button:hover{background:var(--ink);color:var(--bg)}
.yr button:disabled{opacity:.25;cursor:default;background:none;color:var(--ink)}
.yr button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.yr b{min-width:3.2em;text-align:center;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.legend .d{width:18px;height:18px;font-size:0}
.cw-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:clamp(24px,4vw,56px);align-items:start}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:30px 26px}
.mo h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;text-transform:lowercase}
.mo h3 small{font-size:12px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:3px}
.d{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:12px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;box-sizing:border-box}
button.d{all:unset;box-sizing:border-box;position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:12px;line-height:1;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink)}
.d.pad{visibility:hidden}
.d.c{background:var(--ink);color:var(--bg)}
.d.s{box-shadow:inset 0 0 0 1.5px var(--ink)}
.d.c.s{box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 3px var(--bg)}
.d.x::after{content:"";position:absolute;bottom:12%;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor}
.d.today{font-weight:700;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1.5px}
.d.sel{outline:2px solid var(--ink);outline-offset:2px}
button.d:hover{transform:scale(1.15)}
button.d:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dd{position:sticky;top:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 20px);display:flex;flex-direction:column;gap:18px;border-top:1.5px solid var(--ink);padding-top:14px}
.dd-date{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.dd-date span{display:block;margin-top:4px;font-size:14px;font-weight:400;letter-spacing:0;color:var(--muted)}
.dd-house{display:flex;flex-direction:column;gap:10px}
.dd-house h4{margin:0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dd-house h4 .d{width:14px;height:14px;font-size:0}
.ev{display:grid;gap:2px;font-size:14.5px;line-height:1.4;color:inherit;text-decoration:none;border-radius:4px;margin:0 -6px;padding:5px 6px}
a.ev:hover{background:var(--soft)}
a.ev:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
a.ev:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ev .id{font-size:12px;color:var(--muted)}
.ev .t{font-weight:600}
.ev .w{font-size:13.5px}
.ev .r{font-size:12.5px}
.ev .r::before{content:"→ ";color:var(--muted)}
.ev .tag{justify-self:start;margin-top:2px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px dashed var(--ink);border-radius:999px;padding:1px 7px}
.dd-none{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.dd-next{all:unset;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.dd-next:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wait h2{margin:0 0 6px;font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1}
.wait > p{margin:0 0 22px;color:var(--muted);font-size:15px;max-width:62ch}
.wait-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:28px clamp(20px,3vw,40px);align-items:start}
.wait-col h3{margin:0 0 6px;padding-bottom:10px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:700}
.wait-col h3 small{font-size:13px;font-weight:400;color:var(--muted)}
.wait-col ul{list-style:none;margin:0;padding:0}
.wait-col li{border-bottom:1px solid var(--rule)}
.wi{display:grid;gap:3px;padding:12px 6px;margin:0 -6px;color:inherit;text-decoration:none;border-radius:4px;font-size:14.5px;line-height:1.4}
.wi:hover{background:var(--soft)}
.wi:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.wi:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.wi .id{font-size:12px;color:var(--muted)}
.wi .t{font-weight:600}
.wi .n{font-size:13.5px;color:var(--muted)}
.wi .meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;margin-top:2px}
.wi .due{border:1px dashed var(--ink);border-radius:999px;padding:1px 8px}
.wi .since{color:var(--muted)}
@media (max-width:900px){ .cw-body{grid-template-columns:minmax(0,1fr)} .dd{position:static} }
@media (max-width:560px){ .months{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px} .d,button.d{font-size:10.5px} .wk span{font-size:9.5px} .wk,.days{gap:2px} }
.legend .d.x::after{bottom:auto;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--ink)}

/* opening view: three shapes; the bottom one zooms into the plenary */
.landing{position:fixed;inset:0;z-index:15;background:var(--bg);display:grid;place-items:center;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 8px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
  transition:background-color .45s}
.landing[hidden]{display:none!important}
.landing{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:stretch;column-gap:clamp(24px,4vw,64px)}
.landing > .lx{place-self:center;--u:clamp(.36px, min(calc((50vw - 310px) / 420), calc((100vh - var(--menu-h) - 230px) / 680)), .76px)}
/* left half: an index of the three powers, each shape beside what is going on there */
/* the three powers stacked, the whole block centred in the left half */
.lx{display:grid;grid-template-columns:calc(330 * var(--u)) fit-content(270px);column-gap:clamp(18px,2.4vw,36px);width:max-content;max-width:100%;margin:0 auto;font-family:var(--display)}
.lx-row{display:contents}
.lx-shape{display:flex;justify-content:center;align-items:center;padding:clamp(18px,3vh,30px) 0}
.lx-shape svg{display:block;width:calc(var(--vw) * var(--u));height:auto;overflow:visible}
.lx-text{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;align-self:center;max-width:300px;border-radius:10px;transition:opacity .3s}
.landing.leaving .lx-text{opacity:0}
.landing.instant .lx-text{transition:none}
.lx-text:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.lx-n{font-size:clamp(24px,2vw,30px);font-weight:500;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.lx-l{font-size:14px;line-height:1.35}
.lx-b{font-size:13px;line-height:1.35}
.lx-s{font-size:13px;line-height:1.35;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.lx-s.on{color:#E0242B}
.lx-s .lv-dot{width:7px;height:7px}
.lx-text:hover .lx-l{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lg{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.3,.7,.3,1), opacity .4s}
.lg > rect{fill:color-mix(in srgb, var(--ink) 6%, var(--bg));stroke:none;transition:fill .2s}
.lg > circle{fill:var(--bg);stroke:none}
.lg:hover > rect{fill:color-mix(in srgb, var(--ink) 10%, var(--bg))}
.lg:hover,.lg:focus-visible{transform:scale(1.03)}
.lg:focus-visible > rect{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.lg.soon{cursor:default}
/* faint preview of each section inside its shape on the opening view */
.lg .pv{pointer-events:none}
.lg .pv .dots{fill:var(--muted);stroke:none;opacity:.6;transition:fill .3s, opacity .3s}
.lg .pv .dots.vacant{fill:transparent;stroke:var(--muted);stroke-width:1.2}
.lg .pv .u{fill:none;stroke:var(--muted);stroke-width:1.2}
.lg:hover .pv .dots:not(.vacant),.lg:focus-visible .pv .dots:not(.vacant){fill:var(--c,var(--ink));opacity:1}
.landing.leaving{background:transparent;pointer-events:none}
.landing.leaving .lg{opacity:0}
.landing.leaving .lg.mini,.landing.instant,.landing.instant .lg{transition:none}
.seats{transition:opacity .45s}
.stage.zooming #plan,.stfv.zooming svg{will-change:transform}
.stage.zooming .seats{opacity:0}
.arc,.pres{transition:opacity .45s ease}

/* Supremo view */
.stfv{position:fixed;inset:0;z-index:14;background:var(--bg);overflow:auto;box-sizing:border-box;font-family:var(--display);
  padding:calc(env(safe-area-inset-top, 0px) + var(--menu-h) + 72px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 48px) max(16px, env(safe-area-inset-left, 0px))}
.stfv[hidden]{display:none!important}
.stf-grid{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:start}
#stf-svg{display:block;width:100%;height:auto;max-height:calc(100vh - var(--menu-h) - 130px);overflow:visible}
#stf-frame{fill:color-mix(in srgb, var(--ink) 6%, var(--bg));stroke:none}
.u-table{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:miter;transition:opacity .45s}
.jz{fill:var(--ink);cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:transform .18s ease, opacity .45s ease}
.jz.vacant{fill:var(--bg);stroke:var(--ink);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.jz:hover,.jz:focus-visible{transform:scale(1.35)}
.jz.picked{opacity:0}
.stfv.zooming .u-table,.stfv.zooming .jz{opacity:0}
.stf-panel{display:flex;flex-direction:column;gap:clamp(14px,2.2vw,28px);min-width:0;opacity:0;transform:translateY(8px);transition:opacity .45s, transform .45s}

.stf-panel h2{margin:0;font-weight:700;font-size:clamp(36px,4.6vw,68px);line-height:.95;letter-spacing:-.03em;text-wrap:balance}
.stf-panel .tl{max-height:calc(100vh - var(--menu-h) - 300px)}
.stf-sub{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.landing.leaving .lg.zoomsrc{opacity:0;transition:none}
.avatar.vacant{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.p-rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.p-rel a{color:var(--ink);text-underline-offset:3px}
.p-rel span{display:block;font-size:12px;color:var(--muted)}
.d.j::before{content:"";position:absolute;top:4%;right:4%;width:5px;height:5px;border-radius:1px;background:currentColor}
.d.j:not(.c):not(.s){border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.legend .d.j::before{display:none}
@media (min-width:901px){ #stfv .stf-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)} #stfv .stf-panel{order:1} #stfv #stf-svg{order:2} }
#pres-svg{display:block;width:100%;height:auto;max-height:calc(100vh - var(--menu-h) - 130px);overflow:visible}
#pres-frame{fill:color-mix(in srgb, var(--ink) 6%, var(--bg));stroke:none}
.jz.ex{fill:var(--c)}
.pres-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.pres-legend li{display:flex;align-items:center;gap:6px}
.pres-legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pres-legend b{color:var(--ink);font-weight:600}
@media (max-width:900px){ .stf-grid{grid-template-columns:minmax(0,1fr)} .stf-panel .tl{max-height:none;overflow:visible} #stf-svg{max-height:none} }

/* feed of cards on the opening view (right half) */
.today{position:relative;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;gap:12px;font-family:var(--display);color:var(--ink);transition:opacity .35s}
.landing.leaving .today{opacity:0}
.feed-h:not(:has(.lv-tag)){display:none}
.feed-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-right:10px}
.today-h{margin:0;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.feed-live{display:flex;gap:8px;flex-wrap:wrap}
.feed-live .lv-tag{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;margin:0;font-size:12px;line-height:1;color:#E0242B;padding:6px 11px 6px 9px;border-radius:999px;background:color-mix(in srgb, #E0242B 10%, var(--bg))}
.feed-live .lv-tag:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.today > .feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 32px 0;scrollbar-width:thin}

/* cards: the same piece on the opening view and in every section. Soft style: no outline, a light fill, round corners */
.feed{list-style:none;margin:0;display:flex;flex-direction:column;gap:10px}
.card{--card:color-mix(in srgb, var(--ink) 5%, var(--bg));display:flex;flex-direction:column;gap:6px;padding:16px 20px 18px;border-radius:22px;background:var(--card);color:var(--ink);text-decoration:none;font-family:var(--display);transition:background-color .2s, transform .2s}
.card:hover{--card:color-mix(in srgb, var(--ink) 9%, var(--bg))}
.card:active{transform:scale(.995)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.card p,.card h3{margin:0}
.c-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;background:var(--bg);font-size:12px;line-height:1}
.c-dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.card.is-live .c-pill{color:#E0242B}
.card.is-live .c-dot{background:#E0242B;animation:lvp 1.6s ease-in-out infinite}
.c-title{margin-top:6px !important;font-size:19px;line-height:1.22;font-weight:500;letter-spacing:-.015em;text-wrap:pretty}
.c-sub{font-size:13px;color:var(--muted)}
.c-code{font-variant-numeric:tabular-nums}
.c-what{font-size:14px;line-height:1.4}
.mv{display:flex;align-items:center;gap:10px;margin:2px 0 0;align-self:flex-start;max-width:100%}
.c-meta dd:has(.mv){display:block;overflow:visible}
.c-meta .c-vote{grid-column:3;grid-row:1 / span 2;align-self:end}
.c-meta .c-vote.tall{grid-row:1 / span 3}
@media (max-width:560px){ .c-meta .c-vote,.c-meta .c-vote.tall{grid-column:1 / -1;grid-row:auto;order:9;align-self:start} }
.c-meta .mv{align-items:flex-start;gap:8px}
.c-meta .mv svg{width:44px;margin-top:2px}
.c-meta .mv-leg{flex-direction:column;flex-wrap:nowrap;font-size:11.5px}
.mv svg{display:block;width:52px;height:auto;flex:none}
.mv.big{gap:14px;padding:10px 14px;border-radius:14px;background:var(--bg)}
.mv.big svg{width:150px}
.mv circle.mv-y{fill:var(--ink)}
.mv circle.mv-n{fill:#E24B4A}

}

@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

    points:['O Ecad é o escritório que arrecada e distribui os direitos de execução pública de músicas.','A relatora na Comissão de Cultura deu parecer pela aprovação na forma de um texto substitutivo, em abril de 2026.','Com a urgência aprovada, o projeto pode ser votado direto no Plenário, sem concluir a passagem pelas comissões.'],

  'pl-252-2024':{ house:'camara', type:'Projeto de Lei', code:'PL 252/2024',
    title:'Fim da cláusula de barreira em concursos públicos',
    summary:'Proíbe que editais de concursos para cargos efetivos limitem o número de aprovados que seguem para as próximas fases. Quem atingir a nota mínima continua no concurso.',
    points:['Cláusula de barreira é o limite de candidatos que o edital deixa passar de uma fase para outra. Hoje, quem fica fora desse número é eliminado mesmo com a nota mínima.','Pelo projeto, quem passar do número de vagas mas tiver a nota mínima nas demais fases entra no cadastro de reserva, chamado pela ordem de classificação.','A regra vale para União, estados, Distrito Federal e municípios.'],
    author:'Dep. Julio Cesar Ribeiro (Republicanos-DF)', rapporteur:'Não informado nas fontes consultadas',
    status:'Urgência aprovada; aguarda votação no Plenário da Câmara, depois segue ao Senado',

    sources:[URG_13,{l:'Sou Brasília: PL 252/2024 tem urgência aprovada',u:'https://soubrasilia.com/pl-252-2024-clausula-de-barreira-concurso-publico-urgencia-camara/'}] },

  'pl-3716-2026':{ house:'camara', type:'Projeto de Lei', code:'PL 3716/2026',
    title:'Quem paga a reserva de capacidade das baterias',
    summary:'Revoga o trecho da Lei 10.848/2004 que manda dividir só entre os geradores o custo dos contratos de reserva de capacidade com baterias. O custo passaria aos consumidores, como já acontece com outras tecnologias de reserva.',
    points:['Reserva de capacidade é energia contratada para garantir o abastecimento nos horários de pico. Baterias (BESS) armazenam energia para liberar quando necessário.','Seis associações do setor apoiam o projeto e dizem que o custo cobrado dos geradores acaba repassado ao consumidor de qualquer forma, com tributos e taxas a mais.','Elas citam estudo da Volt Robotics que estima economia de mais de R$ 1,6 bilhão por ano com o uso de baterias.'],
    author:'Não informado nas fontes consultadas', rapporteur:'Não informado nas fontes consultadas',
    status:'Urgência aprovada; aguarda votação no Plenário da Câmara',

  'mpv-1375-2026':{ house:'camara', type:'Medida Provisória', code:'MP 1375/2026',
    title:'Indenização para servidores em áreas de fronteira',
    summary:'Amplia as carreiras que recebem a indenização de R$ 91 por dia de trabalho em localidades estratégicas de fronteira, paga a servidores que atuam no combate a crimes transfronteiriços.',
    points:['Os deputados incluíram, entre outros, Abin, peritos criminais, Funai, fiscais agropecuários, INSS, agências reguladoras, Suframa, professores e técnicos das instituições federais de ensino.','Valida pagamentos retroativos para algumas categorias.','Permite que servidores dos antigos territórios (Acre, Amapá, Roraima, Rondônia, entre outros) optem por integrar quadros em extinção.','Transforma 254 cargos vagos de agente administrativo da Fazenda em 50 cargos de inspetor federal do mercado de capitais, para a CVM, sem aumento de despesa segundo o governo.','O Senado aprovou o texto dois dias antes do fim da validade da MP, em 30/10/2026.'],
    author:'Presidência da República', rapporteur:'Sen. Eduardo Gomes (PL-TO), na comissão mista',
    status:'Aprovada pelo Senado em 28/10; vai à sanção',

    votes:{label:'Plenário do Senado, 28/10/2026', result:'Aprovada', note:'Aprovada também pela Câmara em 27/10. Placar não informado nas fontes consultadas.'},
    links:[{l:'MP 1375/2026 no Congresso Nacional',u:CN_MPV+'174944'},{l:'Texto original da MP',u:'https://www2.camara.leg.br/legin/fed/medpro/2026/medidaprovisoria-1375-3-julho-2026-799466-norma-pe.html'}],

  'pl-5649-2026':{ house:'camara', type:'Projeto de Lei', code:'PL 5649/2026',
    title:'Subvenção a produtores de cana do Nordeste',
    summary:'Paga R$ 12 por tonelada de cana entregue a usinas, destilarias ou cooperativas do Nordeste na safra 2025/2026 e mantém até R$ 14,5 bilhões em financiamento para renovar frotas de caminhões e ônibus.',
    points:['O texto reproduz a MP 1374/2026, que perde a validade em 28/10/2026.','A entrega da cana é comprovada por nota fiscal eletrônica. O impacto estimado é de R$ 270 milhões neste ano.','O relator citou estiagens, queda no preço da cana, tarifas dos Estados Unidos e custos mais altos de produção no Nordeste.'],

  'pl-5239-2025':{ house:'camara', type:'Projeto de Lei', code:'PL 5239/2025',
    title:'Consultas no SUS sobre saúde reprodutiva para adolescentes',
    summary:'Garante consultas no SUS para crianças e adolescentes a partir da puberdade ou da primeira menstruação, com foco em saúde reprodutiva e prevenção de doenças. O texto aprovado inclui os meninos.',
    points:['As consultas incluem informação sobre vacinação contra o HPV, orientação sobre saúde sexual e reprodutiva, prevenção de infecções sexualmente transmissíveis e apoio às mudanças físicas e emocionais.','O atendimento fica principalmente na atenção básica, com encaminhamento a especialistas quando necessário.','O atendimento deve ser adequado à idade e ao estágio de desenvolvimento, com respeito à privacidade.'],
    author:'Dep. Adriana Ventura (Novo-SP)', rapporteur:'Dep. Flávia Morais (MDB-GO)',

  'pl-68-2025':{ house:'camara', type:'Projeto de Lei', code:'PL 68/2025',
    title:'Proteção a mulheres em espaços de poder',
    summary:'Cria medidas de proteção para mulheres em posições de liderança que sofrem violência política de gênero, alterando a Lei 14.192/2021, o Código Eleitoral e o Código Penal.',
    points:['Alcança defensoras de direitos humanos, lideranças comunitárias, dirigentes de partidos, sindicatos e movimentos sociais, e mulheres em cargos de chefia em empresas ou no setor público.','A proteção pode ser feita pela polícia ou pelo Ministério Público.','Aumenta as penas quando a violência política contra a mulher for motivada por preconceito de orientação sexual ou identidade de gênero.','A Comissão de Direitos Humanos deu parecer pela aprovação, na forma de substitutivo, em setembro de 2025.'],
    author:'Dep. Daiana Santos (PCdoB-RS)', rapporteur:'Dep. Natália Bonavides (PT-RN)',

  'pdl-274-2026':{ house:'camara', type:'Projeto de Decreto Legislativo', code:'PDL 274/2026',
    title:'Acordo do Mercosul sobre medidas protetivas',
    summary:'Aprova o acordo do Mercosul e de Estados associados para o reconhecimento mútuo de medidas de proteção a mulheres em situação de violência de gênero. Na prática, uma medida protetiva dada em um país passa a valer nos demais.',
    points:['Acordos internacionais precisam ser aprovados pelo Congresso por meio de decreto legislativo antes de entrar em vigor no Brasil.','A Comissão de Defesa dos Direitos da Mulher aprovou o parecer em 10/06/2026, e a Comissão de Constituição e Justiça também tem parecer favorável.'],

  'pl-5902-2023':{ house:'camara', type:'Projeto de Lei', code:'PL 5902/2023',
    title:'Drones no espaço aéreo de presídios',

  'pec-221-2019':{ house:'senado', type:'Proposta de Emenda à Constituição', code:'PEC 221/2019',
    title:'Fim da escala 6x1',
    summary:'Garante dois dias de descanso semanal remunerado, um deles de preferência no domingo, e reduz a jornada máxima de 44 para 40 horas semanais, sem redução de salário. Virou a Emenda Constitucional 141.',
    points:['Transição: 60 dias após a publicação, o limite cai para 42 horas com duas folgas. Cerca de 14 meses depois, chega a 40 horas.','Acordos coletivos podem compensar horários e folgas durante a transição, com pelo menos um descanso a cada sete dias.','Ficam de fora servidores públicos e profissionais com diploma de nível superior que ganham pelo menos 2,5 vezes o teto do INSS.','Uma lei complementar pode criar regras de adaptação para MEIs, micro e pequenas empresas, condicionadas à manutenção de empregos.'],

    votes:{label:'Plenário do Senado, 14/10/2026', result:'Aprovada em dois turnos', tally:[['1º turno',75,1],['2º turno',75,1]], note:'Único voto contrário: sen. Hamilton Mourão (Republicanos-RS). Uma PEC precisa de 49 votos no Senado.'},

  'pec-18-2025':{ house:'senado', type:'Proposta de Emenda à Constituição', code:'PEC 18/2025',
    title:'PEC da Segurança Pública',
    summary:'Reorganiza a segurança pública na Constituição: inclui o Sistema Único de Segurança Pública (Susp), endurece o tratamento de facções e milícias e cria novas fontes de financiamento.',
    points:['Permite que uma lei futura restrinja a progressão de regime e benefícios penais para integrantes de facções e milícias.','Autoriza a criação de polícias municipais e amplia a atuação da Polícia Rodoviária Federal para ferrovias e hidrovias.','Na CCJ, a retirada da regra sobre recursos das bets foi aprovada. Trechos alterados em relação à Câmara terão de voltar aos deputados.','Governadores resistem por preocupação com a autonomia das polícias estaduais.','Precisa de ao menos 49 votos em dois turnos no Plenário.'],

  'mpv-1370-2026':{ house:'senado', type:'Medida Provisória', code:'MP 1370/2026',
    title:'Enamed obrigatório para exercer a medicina',
    summary:'Exige aprovação no Exame Nacional de Avaliação da Formação Médica (Enamed) para obter registro no Conselho Regional de Medicina.',
    points:['A prova é feita em três etapas, ao fim do 2º, 4º e 6º anos do curso. A nota final é uma média com peso maior para a última.','Vale para quem entrou na graduação a partir de 19/06/2026. Quem já estava matriculado fica dispensado.','Quem não atingir o mínimo pode refazer a terceira prova. Sem a aprovação, o formado só pode atuar em atividades técnico-científicas, sem atender pacientes.','Uma comissão com representantes do CFM, do MEC e do Ministério da Saúde define o desempenho mínimo. As faculdades terão de divulgar seus resultados.'],

  'plp-186-2026':{ house:'senado', type:'Projeto de Lei Complementar', code:'PLP 186/2026',
    title:'Novo limite do MEI e perdão de dívidas',
    summary:'Aumenta o limite de faturamento do MEI de R$ 81 mil para R$ 110 mil em 2027 e R$ 140 mil em 2028, e perdoa dívidas de MEIs inscritas na Dívida Ativa da União até 13/10/2026. Virou a Lei Complementar 238.',

  're-835818':{ house:'stf', type:'Recurso Extraordinário', code:'RE 835818 · Tema 843',
    title:'Créditos presumidos de ICMS fora do PIS e da Cofins',
    summary:'O STF decidiu que os créditos presumidos de ICMS, um benefício fiscal dado pelos estados, não entram na base de cálculo do PIS e da Cofins.',
    points:['Para o Tribunal, o crédito presumido não é riqueza nova da empresa. Por isso, incluí-lo ampliaria a base das contribuições além do que a Constituição permite.','Registrar o crédito na contabilidade não o transforma em receita.','A decisão tem repercussão geral: vale para todos os processos iguais, que estavam suspensos.','Não houve modulação dos efeitos. O tema ainda pode voltar em embargos de declaração.'],
    author:'União (recorrente)', rapporteur:'Não informado nas fontes consultadas',

const LIVE_RE = /sess|live/i;
function nowBR(){ try{ const f = new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).split(':'); return (+f[0])*60 + (+f[1]); }catch(e){ const d=new Date(); return d.getHours()*60+d.getMinutes(); } }
function hm(t){ const m = /(\d{1,2})h(\d{2})?/.exec(t||''); return m ? (+m[1])*60 + (+(m[2]||0)) : null; }
// state of today's session: 'live', 'soon' (later today) or null
// data/live.json is written every hour by the robot in the GitHub repository (scripts/atualizar.py)
let LIVE_DATA = null;
function loadLive(){
  if (!/^https?:$/.test(location.protocol)) return;
  fetch('data/live.json', {cache:'no-store'}).then(r=> r.ok ? r.json() : null).then(js=>{ if (js){ LIVE_DATA = js; refreshLive(); } }).catch(()=>{});
}
const FRAMED = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
function minutesOf(isoStr){ const m = /T(\d{2}):(\d{2})/.exec(isoStr||''); return m ? (+m[1])*60 + (+m[2]) : null; }
// sessions reported by the official APIs; null when there is no fresh data for this house
function apiState(key){
  const list = LIVE_DATA && LIVE_DATA[key];
  if (!Array.isArray(list) || !LIVE_DATA.atualizado) return null;
  if (Date.now() - new Date(LIVE_DATA.atualizado).getTime() > 3*3600e3) return null;
  const t = todayISO(), now = nowBR();
  const today = list.filter(x=> (x.inicio||'').slice(0,10)===t && !/cancel|adiad|não realizada/i.test(x.situacao||''));
  const on = today.find(x=> x.aoVivo || (!/encerr/i.test(x.situacao||'') && minutesOf(x.inicio)!=null && minutesOf(x.inicio) <= now && (minutesOf(x.fim)==null || minutesOf(x.fim) > now)));
  if (on) return {s:'live', day:{kind: on.tipo || 'Sessão'}, st: minutesOf(on.inicio) ?? now, video: on.video};
  const next = today.filter(x=> minutesOf(x.inicio) > now).sort((a,b)=> a.inicio.localeCompare(b.inicio))[0];
  if (next) return {s:'soon', day:{kind: next.tipo || 'Sessão'}, st: minutesOf(next.inicio)};
  return {s:null};
}
function ytEmbed(u){
  const m = /(?:v=|youtu\.be\/|\/live\/|\/embed\/)([\w-]{11})/.exec(u||'');
  return m ? `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1` : null;
}
function liveState(key){
  const api = apiState(key);
  if (api) return api.s ? api : null;
  const L = LIVE[key], t = todayISO();
  const day = (AGENDA[key]?.days||[]).find(d=> d.date===t && !d.label && (d.live || (key!=='exec' && LIVE_RE.test(d.kind||''))));
  if (!day) return null;
  const st = hm(day.time || L.start); if (st==null) return null;
  const en = day.end ? hm(day.end) : st + L.hours*60, now = nowBR();
  if (now >= st && now < en) return {s:'live', day, st};
  if (now < st) return {s:'soon', day, st};
  return null;
}
function liveBox(key){
  const st = liveState(key), L = LIVE[key];
  if (!st) return `<div class="live-slot" data-k="${key}" hidden></div>`;
  // on the published site (not inside another page) the session plays right here
  const src = st.s==='live' && !FRAMED ? (ytEmbed(st.video) || (L.channel ? `https://www.youtube.com/embed/live_stream?channel=${L.channel}&autoplay=1&mute=1` : null)) : null;
  const player = src ? `<div class="lv-video"><iframe src="${src}" title="Transmissão ao vivo: ${esc(L.name)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>` : '';
  const h = `${Math.floor(st.st/60)}h${st.st%60 ? String(st.st%60).padStart(2,'0') : ''}`;
  const links = L.links.map((x,i)=>`<a class="${i?'lv-alt':'lv-go'}" href="${x.u}" target="_blank" rel="noopener">${esc(x.l)}${i?'':' ↗'}</a>`).join('');
  return st.s==='live'
    ? `<div class="live-slot" data-k="${key}"><div class="live on" role="status"><p class="lv-h"><span class="lv-dot" aria-hidden="true"></span>Ao vivo · ${esc(st.day.kind)} em curso</p><p class="lv-t">Transmissão pela ${L.name}, desde as ${h}.</p>${player}<div class="lv-links">${links}</div></div></div>`
    : `<div class="live-slot" data-k="${key}"><div class="live"><p class="lv-h"><span class="lv-dot off" aria-hidden="true"></span>Hoje às ${h} · ${esc(st.day.kind)}</p><p class="lv-t">A transmissão pela ${L.name} aparece aqui quando a sessão começar.</p><div class="lv-links">${links}</div></div></div>`;
}

const LX = {stf:{keys:['stf'], none:'nenhum processo em curso', one:'processo em curso no Supremo', many:'processos em curso no Supremo'},

const DONE_RE = /julgad[ao] em|sancionad|promulgad|vetad|arquivad|rejeitad|decidid|conclu[ií]d|transitad|virou lei|perdeu a validade/i;
function renderIndex(){
  if (typeof CARDS==='undefined' || !document.getElementById('lx-n-stf')) return;
  const t = todayISO();
  for (const k in LX){
    const X = LX[k];
    const here = CARDS.map(c=>({c, S:cardState(c,null)})).filter(x=> X.keys.includes(x.S.here) && !DONE_RE.test(x.c.P.status||''));
    const n = here.length;
    document.getElementById('lx-n-'+k).textContent = n;
    let lab = n===0 ? X.none : n===1 ? X.one : X.many;
    document.getElementById('lx-l-'+k).textContent = lab;
    const sp = document.getElementById('lx-b-'+k);
    if (sp){ const c = here.filter(x=>x.S.here==='camara').length; sp.textContent = n ? `${c} na Câmara · ${n-c} no Senado` : ''; }
    const st = document.getElementById('lx-s-'+k);
    const liveK = X.keys.find(x=> liveState(x)?.s==='live');
    if (liveK){
      st.className = 'lx-s on';
      st.innerHTML = `<span class="lv-dot" aria-hidden="true"></span>ao vivo agora${k==='cong' ? ' · '+POWER_NAME[liveK] : ''}`;
      continue;
    }
    st.className = 'lx-s';
    const days = X.keys.flatMap(x=> AGENDA[x].days.map(d=>({...d, key:x})));
    const soon = X.keys.map(x=> liveState(x)).find(v=> v && v.s==='soon');
    const next = days.filter(d=> d.date>t).sort((a,b)=> a.date.localeCompare(b.date))[0];
    const last = days.filter(d=> d.date<=t && !d.label).sort((a,b)=> b.date.localeCompare(a.date))[0];
    const word = k==='pres' ? 'próximo compromisso' : 'próxima sessão';
    st.textContent = soon ? `hoje às ${Math.floor(soon.st/60)}h${soon.st%60?String(soon.st%60).padStart(2,'0'):''}`
      : next ? `${word}: ${next.label ? 'semana de '+cardDate(next.date) : cardDate(next.date, next.time)}`
      : last ? `última atividade: ${cardDate(last.date)}` : '';
  }
}

function timelineHTML(key){
  const A = AGENDA[key], today = todayISO();
  return A.days.map(d=>{
    const [y,m,dd] = d.date.split('-').map(Number), dt = new Date(y,m-1,dd);
    const st = d.date<today ? 'past' : d.date===today ? 'today' : 'future';
    const label = st==='past'?'Realizada':st==='today'?'Hoje':'Próxima';

/* ---------- geometry (units of the circle radius, u points away from the president) ---------- */
// Each half of the house is a stack of rows read from the aisle outward (away from the presidents).
// A row never holds more seats than the row before it, seats grow from the president's side, and if
// the outermost row would end up with fewer than 4 seats those seats move into the rows before it.
// Seats are then read in one serpentine path (top half from the outer edge to the aisle, bottom half
// from the aisle outward, each row reversing direction) so every party stays in one connected block.
const MIN_LAST_ROW = 4;
function fillHalf(rows, K){
  // rows: [{v, cap, at(j)}] ordered from the aisle outward
  const n = [];
  let left = K;
  for (let i=0; i<rows.length && left>0; i++){
    const c = Math.min(rows[i].cap, i ? n[i-1] : Infinity, left);
    if (c<=0) break;
    n.push(c); left -= c;
  }
  for (let i=0; left>0; i=(i+1)%n.length){ n[i]++; left--; }               // not enough room: lengthen inner rows
  while (n.length>1 && n[n.length-1] < MIN_LAST_ROW){                      // short last row: spread it inward
    let extra = n.pop();
    for (let i=0; extra>0; i=(i+1)%n.length){ n[i]++; extra--; }
  }
  for (let i=n.length-1; i>0; i--) if (n[i]>n[i-1]){ const d=n[i]-n[i-1]; n[i]-=d; n[i-1]+=d; } // keep rows non-increasing
  if (n.length>1 && n[0]>n[1]){ n[0]--; n[1]++; }                          // no lone sphere sticking out at the aisle: pass it to the next row
  return n.map((cnt,i)=>Array.from({length:cnt},(_,j)=>rows[i].at(j)));
}
function assemble(topRows, botRows, N, T){
  const top = fillHalf(topRows, T).reverse();          // print top half from the outer edge to the aisle
  const bot = fillHalf(botRows, N-T);
  const out = [];
  [...top, ...bot].forEach((row,i)=>{ row.sort((a,b)=>a.u-b.u); if (i%2) row.reverse(); out.push(...row); });
  return out;
}
function layoutSenado(N, r, sp, T){
  // reference arrangement (6 columns) with the Câmara's sphere size and spacing
  const d=1.41, cols=6, rowsHalf=Math.ceil(Math.max(T,N-T)/cols)+2, mid=.28, q0=d+mid-(cols-1)*sp/2;
  const half = sg => Array.from({length:rowsHalf},(_,i)=>{
    const v=sg*sp*(.8+i);
    return {v, cap:cols, at:j=>{ const q=q0+j*sp; return {u:-d+Math.sqrt(q*q-v*v), v}; }};
  });
  return {seats:assemble(half(-1), half(1), N, T), r};
}
function layoutCamara(N, T){
  // reference shape enlarged by F so it sits closer to its circle and the spheres can grow
  const F=1.18, d=1.45*F, u0=-.25*F, Ro=.68*F, vmax=.64*F, need=Math.max(T,N-T);
  const rowsAt = (s, sg) => { const rows=[];
    for (let i=0;;i++){
      const v=sg*s*(.8+i); if (Math.abs(v)>vmax) break;
      const lim = Ro*Ro>v*v ? Math.sqrt(Ro*Ro-v*v) : -9;
      const at = j=>{ const q=d+u0+j*s; return {u:-d+Math.sqrt(q*q-v*v), v}; };
      let cap=0; while (cap<400 && at(cap).u<=lim) cap++;
      rows.push({v, cap, at});
    }
    return rows; };
  // capacity of a half when rows can't grow longer than the row before them
  const room = s => { let prev=Infinity, tot=0; for (const r of rowsAt(s,1)){ prev=Math.min(prev,r.cap); tot+=prev; } return tot; };
  let lo=.01, hi=.2;
  for (let k=0;k<40;k++){ const m=(lo+hi)/2; if (room(m)>=need) lo=m; else hi=m; }
  return {seats:assemble(rowsAt(lo,-1), rowsAt(lo,1), N, T), r:.45*lo, sp:lo};
}

/* ---------- build ---------- */
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for (const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function setT(g,t){ g.setAttribute('transform',`translate(${t.x.toFixed(2)} ${t.y.toFixed(2)}) scale(${t.s.toFixed(3)})`); }

for (const key of ['camara','senado']){
  const H = HOUSES[key], g = document.getElementById('g-'+key);
  H.g = g; H.cur = {...H.home}; setT(g, H.cur);
  const total = Object.values(H.data).reduce((a,b)=>a+b,0);
  const inner = el('g',{class:'inner'}, g);
  el('circle',{class:'shell', r:1, 'vector-effect':'non-scaling-stroke'}, inner);
  const a=H.arcA*Math.PI/180, sd=H.side, x1=sd*-H.arcR*Math.cos(a), y1=-H.arcR*Math.sin(a), y2=-y1;
  const seatsG = el('g',{class:'seats'}, inner);
  el('path',{class:'arc', d:`M${x1} ${y1} A${H.arcR} ${H.arcR} 0 0 ${sd>0?0:1} ${x1} ${y2}`, 'vector-effect':'non-scaling-stroke'}, seatsG);
  const k = HOUSES.camara.home.s/H.home.s;
  const L = key==='senado' ? layoutSenado(total, HOUSES.camara.r*k, HOUSES.camara.sp*k, H.T) : layoutCamara(total, H.T);
  H.r = L.r; H.sp = L.sp;
  el('circle',{class:'pres', cx:sd*H.presU, cy:0, r:L.r.toFixed(4)}, seatsG);
  const list = H.people.map(x=>x.p);
  H.seats = L.seats.map((s,i)=>{
    const c = el('circle',{class:'seat', cx:(sd*s.u).toFixed(4), cy:s.v.toFixed(4), r:L.r.toFixed(4)}, seatsG);
    c.dataset.p = list[i]; c.style.setProperty('--c', PARTY[list[i]]);
    return c;
  });
}

const PARTY_NAME = {PSOL:'PSOL',Rede:'Rede',PCdoB:'PCdoB',PT:'PT',PV:'PV',PSB:'PSB',PDT:'PDT',Avante:'Avante',Solidariedade:'Solidariedade',MDB:'MDB',PSD:'PSD',Podemos:'Podemos',PSDB:'PSDB',PRD:'PRD','União':'União Brasil',PP:'Progressistas',Republicanos:'Republicanos','Missão':'Missão',Novo:'Novo',PL:'PL',NC:'Sem partido'};

/* ---------- interaction ---------- */
const stage = document.getElementById('stage'), panel = document.getElementById('panel');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let openKey = null, anim = null, colorTimer = null;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function tween(H, to, dur){
  cancelAnimationFrame(anim);
  const from = {...H.cur}, t0 = performance.now();
  if (reduce){ H.cur={...to}; setT(H.g,H.cur); return; }
  const step = now => {
    const k = Math.min(1,(now-t0)/dur), e = ease(k);
    H.cur = {x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e, s:from.s+(to.s-from.s)*e};
    setT(H.g,H.cur);
    if (k<1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function open(key){
  if (openKey) return;
  openKey = key; const H = HOUSES[key];
  stage.classList.add('is-open','open-'+key);
  renderPanel(key); panel.hidden = false;
  requestAnimationFrame(()=>{
    panel.classList.add('show');
    const tl = panel.querySelector('.tl'), cur = panel.querySelector('.day.today') || panel.querySelector('.day.future');
    if (tl && cur && tl.scrollHeight>tl.clientHeight) tl.scrollTop = Math.max(0, cur.offsetTop - tl.clientHeight*.35);
  });
  H.g.classList.add('is-active');
  Object.values(HOUSES).forEach(o=>o.g.setAttribute('tabindex','-1'));
  tween(H, H.open, 750);
  const n = H.seats.length;
  H.seats.forEach((s,i)=> s.style.transitionDelay = reduce ? '0ms' : (i/n*520).toFixed(0)+'ms, 0ms');
  clearTimeout(colorTimer);
  colorTimer = setTimeout(()=>{
    H.g.classList.add('colored');
    // drop the stagger once the colors land so hover stays instant
    setTimeout(()=>H.seats.forEach(s=>s.style.transitionDelay=''), reduce?0:1200);
  }, reduce?0:720);   // after the zoom settles, so the two animations don't compete
}

function close(){
  if (!openKey) return;
  const H = HOUSES[openKey]; openKey = null;
  clearTimeout(colorTimer);
  H.seats.forEach(s=> s.style.transitionDelay='');
  H.g.classList.remove('colored','is-active');
  stage.classList.remove('is-open','open-senado','open-camara');
  panel.classList.remove('show'); panel.hidden = true;
  Object.values(HOUSES).forEach(o=>o.g.setAttribute('tabindex','0'));
  tween(H, H.home, 650);
  H.g.focus({preventScroll:true});
}

const partyEl = document.getElementById('party');

const fmt = n => n.toLocaleString('pt-BR');
const initialsOf = n => n.replace(/^(Dr\.?|Dra\.?|Prof\.?|Professora?|Delegad[oa]|Sargento|Coronel|Capitão|Cabo|General|Pastor|Subtenente|Major|Defensor)\s+/i,'').split(/\s+/).filter(w=>w.length>2||/^[A-ZÀ-Ú]/.test(w)).filter((w,i,a)=>i===0||i===a.length-1).map(w=>w[0]).join('').toUpperCase();
function onColor(color){
  const hex = /^#([0-9a-f]{6})$/i.exec(color);
  const lum = hex ? (([r,g,b])=>.2126*r+.7152*g+.0722*b)([0,2,4].map(i=>{ const c=parseInt(hex[1].substr(i,2),16)/255; return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4); })) : 0;
  return lum>.3 ? '#121417' : '#fff';
}
function visible(el){ const r = el.getBoundingClientRect(); return r.width>0 && r.bottom>0 && r.top<innerHeight; }
// put the avatar exactly over the source sphere (avatar uses transform-origin 0 0)
function flipFrom(av, el){
  av.style.transform = 'none';
  const a = av.getBoundingClientRect(), b = el.getBoundingClientRect(), k = b.width/a.width;
  av.style.transform = `translate(${b.left-a.left}px, ${b.top-a.top}px) scale(${k})`;
}
function growIn(layer, av, src){
  layer.hidden = false;
  av.style.transition = 'none';
  flipFrom(av, src);
  src.classList.add('picked');
  av.getBoundingClientRect();
  requestAnimationFrame(()=>{ av.style.transition = ''; av.style.transform = ''; layer.classList.add('show'); });
}
function shrinkOut(layer, av, src, done){
  layer.classList.remove('show');
  if (src && visible(src)){ av.style.transform = ''; flipFrom(av, src); }
  else av.style.opacity = '0';
  setTimeout(()=>{ if (src) src.classList.remove('picked'); layer.hidden = true; layer.innerHTML = ''; done && done(); }, reduce?0:620);
}

/* ---------- cards: every proposal or case is one card that travels between the powers ----------

const POWER_NAME = {camara:'Câmara', senado:'Senado', exec:'Presidência', stf:'STF'};
const POWER_GLYPH = {camara:'cong', senado:'cong', exec:'exec', stf:'stf'};
function stepPower(text, P){
  if (P.house==='stf') return 'stf';
  // the power named first in the step is where it happened ("Câmara aprova; segue ao Senado" is the Câmara)
  const at = [['stf',/\bSTF\b|Supremo/i],['exec',/sanç|sancion|vet(o|ad)|Presid[eê]n(te|cia) da Rep|\bLula\b|Planalto|Governo|Diário Oficial|publicad|edita|nomead/i],['senado',/Senado|senador/i],['camara',/Câmara|Deputad/i]]
    .map(([k,re])=>{ const m = re.exec(text); return m ? [k, m.index] : null; }).filter(Boolean).sort((x,y)=> x[1]-y[1]);
  return at.length ? at[0][0] : P.house;
}
const evMin = e => hm(e.time) ?? -1;
const byWhen = (a,b) => a.date.localeCompare(b.date) || evMin(a) - evMin(b);
const CARDS = (()=>{
  const m = {};
  for (const slug in PROJECTS) m[slug] = {slug, P:PROJECTS[slug], ev:[]};
  for (const key in AGENDA) AGENDA[key].days.forEach(d=> d.items.forEach(it=>{
    if (it.ref && m[it.ref] && !/não realizad|cancelad/i.test(it.r||'')) m[it.ref].ev.push({date:d.date, time:d.time||'', key, kind:d.kind||'', r:it.r||'', week:!!d.label});
  }));
  Object.values(m).forEach(c=>{
    (c.P.steps||[]).forEach(([date,t])=>{
      const k = stepPower(t, c.P);
      if (!c.ev.some(e=> e.date===date && e.key===k)) c.ev.push({date, time:'', key:k, kind:'', r:t});
    });
    c.ev.sort(byWhen);
  });
  return Object.values(m);
})();
function cardState(c, key){
  const t = todayISO(), now = nowBR();
  const done = e => !e.week && (e.date < t || (e.date===t && (hm(e.time)==null || hm(e.time) <= now)));
  const past = c.ev.filter(done), next = c.ev.find(e=> !done(e));
  const lastAll = past[past.length-1] || null;
  const scope = key ? past.filter(e=> e.key===key) : past;
  const last = scope[scope.length-1] || null;
  let here = lastAll ? lastAll.key : c.P.house;
  const r = lastAll ? lastAll.r : '';
  if (/sanç/i.test(r) && c.P.house!=='stf') here = 'exec';
  else if (/(vai|segue|enviad[oa]) (ao|para o) Senado/i.test(r)) here = 'senado';
  else if (/(volta|segue|vai) (à|para a) Câmara/i.test(r)) here = 'camara';

  const path = [];
  past.forEach(e=>{ if (!path.includes(e.key)) path.push(e.key); });

  if (path[path.length-1]!==here) path.push(here);
  return {last, next, here, path, created: (c.P.steps && c.P.steps[0] && /apresent|protocol|edita|publicad|ajuizad|proposta|enviad|criad|assinad/i.test(c.P.steps[0][1])) ? c.P.steps[0][0] : null};

function cardDate(iso, time){

/* mini plenary: one dot per seat, coloured by how it voted (only when the sources give the count) */
function voteBody(P){

  if (P.house==='stf' || /STF|Supremo|Plenário virtual|Plenário, /.test(v.label||'') && P.house==='stf') return 'stf';
  if (/Senado/i.test(v.label||'') || (P.house==='senado' && !/Câmara/i.test(v.label||''))) return 'senado';

  const v = P.votes, [lab, yes, no] = v.tally[v.tally.length-1], [ly, ln] = v.labels || ['sim','não'];
  const total = body==='stf' ? 11 : body==='senado' ? 81 : 513, rest = Math.max(0, total - yes - no);
  const kinds = [...Array(yes).fill('y'), ...Array(no).fill('n'), ...Array(rest).fill('o')];
  let pts = [], vb, r;
  if (body==='stf'){
    // the U table: four seats up each arm and three across the bottom, filled left arm → bottom → right arm
    const L = [[10,10],[10,22],[10,34],[10,46]], B = [[24,56],[38,56],[52,56]], R = [[66,46],[66,34],[66,22],[66,10]];
    pts = [...L, ...B, ...R]; vb = '0 0 76 64'; r = 4.2;
  } else {
    // hemicycle: rows of seats on concentric arcs, filled by angle from left to right
    const rows = body==='senado' ? 4 : 9, R1 = 50, R0 = body==='senado' ? 26 : 18, all = [];
    const radii = Array.from({length:rows}, (_,i)=> R0 + (R1-R0)*i/(rows-1));
    const sum = radii.reduce((a,b)=>a+b,0);
    let left = total;
    radii.forEach((rad,i)=>{ const n = i===rows-1 ? left : Math.round(total*rad/sum); left -= n;
      for (let j=0;j<n;j++){ const a = Math.PI*(n===1?.5:j/(n-1)); all.push({a, x:54-Math.cos(a)*rad, y:54-Math.sin(a)*rad}); } });
    all.sort((p,q)=> p.a-q.a); pts = all.map(p=>[p.x,p.y]); vb = '0 0 108 58'; r = body==='senado' ? 2.3 : 1.25;

  const legend = `<span><i class="mv-y"></i>${yes} ${esc(ly)}</span><span><i class="mv-n"></i>${no} ${esc(ln)}</span>${rest ? `<span><i class="mv-o"></i>${rest} ${body==='stf'?'sem voto':'não votaram'}</span>` : ''}`;
  const label = `${v.tally.length>1 ? esc(lab)+' · ' : ''}${body==='stf'?'STF':body==='senado'?'Senado':'Câmara'}`;
  return `<div class="mv${big?' big':''}" role="img" aria-label="${label}: ${yes} ${esc(ly)}, ${no} ${esc(ln)}${rest?', '+rest+' sem voto':''}"><svg viewBox="${vb}" aria-hidden="true">${table}${dots}</svg><p class="mv-leg"><b>${label}</b>${legend}</p></div>`;
}
function cardHTML(c, key){

function enterView(V){

  landing.classList.add('instant'); landing.style.backgroundColor = 'transparent'; landing.getBoundingClientRect();

function exitView(V){

/* previews: the real seats of each section, drawn small and grey inside its shape.
   All seats of one colour become a single path, so the opening view stays light. */
(function(){
  const NS2 = 'http://www.w3.org/2000/svg';
  const pv = (parent, t) => { const g = document.createElementNS(NS2,'g'); g.setAttribute('class','pv'); g.setAttribute('aria-hidden','true'); g.setAttribute('transform', t); parent.appendChild(g); return g; };
  const ring = (x,y,r) => `M${(x-r).toFixed(3)} ${y.toFixed(3)}a${r} ${r} 0 1 0 ${(2*r).toFixed(3)} 0a${r} ${r} 0 1 0 ${(-2*r).toFixed(3)} 0`;
  function dots(g, sources){
    const by = new Map();
    sources.forEach(src=>{
      const vac = src.classList.contains('vacant'), c = vac ? 'vacant' : (src.style.getPropertyValue('--c') || '');
      if (!by.has(c)) by.set(c, []);
      by.get(c).push(ring(+src.getAttribute('cx'), +src.getAttribute('cy'), +src.getAttribute('r')));
    });
    by.forEach((d,c)=>{
      const p = document.createElementNS(NS2,'path');
      p.setAttribute('d', d.join(''));
      p.setAttribute('class', c==='vacant' ? 'dots vacant' : 'dots');
      if (c && c!=='vacant') p.style.setProperty('--c', c);
      g.appendChild(p);
    });
  }
  // frame of a section mapped onto its shape (same mapping the zoom uses)
  const fit = (fr, mini) => { const k = +mini.getAttribute('width') / +fr.getAttribute('width');
    return `translate(${+mini.getAttribute('x')} ${+mini.getAttribute('y')}) scale(${k.toFixed(5)}) translate(${-fr.getAttribute('x')} ${-fr.getAttribute('y')})`; };
  // Congresso: both houses in their unit circles
  const circ = document.querySelectorAll('#mini > circle');
  [['senado',circ[0]],['camara',circ[1]]].forEach(([key,c])=>{
    const g = pv(document.getElementById('mini'), `translate(${c.getAttribute('cx')} ${c.getAttribute('cy')}) scale(${c.getAttribute('r')})`);
    dots(g, HOUSES[key].g.querySelectorAll('.pres, .seat'));
  });
  // STF: the U table and the eleven seats
  const gs = pv(lgStf, fit(stfFrame, document.getElementById('stf-mini')) + ' translate(345 252.5) scale(.426) translate(-345 -273)');
  const u = document.querySelector('#stf-bench .u-table').cloneNode(false); u.setAttribute('class','u'); u.removeAttribute('vector-effect'); gs.appendChild(u);
  dots(gs, document.querySelectorAll('#stf-bench .jz'));
  // Presidência: president, vice and ministries
  const fx = +presFrame.getAttribute('x') + +presFrame.getAttribute('width')/2, fy = +presFrame.getAttribute('y') + +presFrame.getAttribute('height')/2;
  const gp = pv(lgPres, fit(presFrame, document.getElementById('pres-mini')) + ` translate(${fx} ${fy}) scale(.804) translate(${-PRES_BENCH.cx} ${-PRES_BENCH.cy})`);
  dots(gp, document.querySelectorAll('#pres-bench .jz'));
})();

const HOUSE_ORDER = ['camara','senado','congresso','stf','exec'];
const HOUSE_MARK = {camara:'c', senado:'s', congresso:'c s', stf:'j', exec:'x'};
// which house a tramitação step happened in, read from its wording
function stepHouse(text, P){
  if (P.house==='stf') return 'stf';
  if (P.house==='exec') return 'exec';
  if (/Comissão mista|Congresso|Sessão solene|prorrogad|Promulgad/i.test(text)) return 'congresso';
  if (/Senado/.test(text)) return 'senado';
  if (/Câmara/.test(text)) return 'camara';
  if (/Diário Oficial|ancionad|sanção|Governo edita/i.test(text)) return 'exec';
  return P.house;
}
// every dated step of every project, merged with the plenary agendas of both houses
const EVENTS = (()=>{
  const map = new Map();
  const add = e => {
    const k = e.date+'|'+(e.ref||e.label)+'|'+e.house, old = map.get(k);
    if (old){ if (!old.result && e.result) old.result = e.result; if (!old.time && e.time) old.time = e.time; if (!old.kind && e.kind) old.kind = e.kind; if (e.week) old.week = true; if (e.fromAgenda) old.fromAgenda = true; }
    else map.set(k, e);
  };
  Object.entries(PROJECTS).forEach(([ref,P])=> P.steps.forEach(([date,text])=> add({date, ref, house:stepHouse(text,P), text})));
  Object.entries(AGENDA).forEach(([key,A])=> A.days.forEach(d=>{
    const house = /Congresso/.test(d.kind) ? 'congresso' : key;
    d.items.forEach(it=> add({date:d.date, time:d.time||'', kind:d.kind||'', ref:it.ref||null, label:it.id||null, house, text: it.t || 'Na pauta do Plenário', result: it.r||'', week:!!d.label, fromAgenda:true}));
  }));
  return [...map.values()];
})();

EVENTS.forEach(e=>{ (EV_BY_DATE[e.date] = EV_BY_DATE[e.date] || []).push(e); });
const EV_DATES = Object.keys(EV_BY_DATE).sort();

  {l:'Agência Câmara: notícias do Plenário', u:'https://www.camara.leg.br/noticias'},
  {l:'Senado Notícias: Senado Agora', u:'https://www12.senado.leg.br/noticias/senado-agora'},
