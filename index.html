/* calendar: one month at a time, the three powers as the opening view's shapes,
   only decisions and deadlines unless "todas as etapas" is on */
const POWER = {camara:'cong', senado:'cong', congresso:'cong', stf:'stf', exec:'exec'};
const POWER_LABEL = {cong:'Congresso', stf:'Supremo', exec:'Presidência'};
const POWER_ORDER = ['cong','stf','exec'];
const SUB_LABEL = {camara:'Câmara', senado:'Senado', congresso:'Congresso'};
const MAJOR_RE = /aprova|sanciona|promulga|à sanção|prazo|MP publicada|Votação esperada|Retirad|vista|conclui|decide|adiad|suspens|julgamento|Eleição|Posse/i;
const MINOR_RE = /Comissão|parecer|CCJ|relatório|Distribuíd|Apresentado|Chega ao|Recebid|Volta à|prorrogad|protocolado|preliminar/i;
EVENTS.forEach(e=>{ e.power = POWER[e.house]; e.major = !!e.fromAgenda || (MAJOR_RE.test(e.text) && !MINOR_RE.test(e.text)); });
const MES_AB = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let calYear = null, calMonth = null, calSel = null, calView = null, calAll = false;
const calFilter = new Set(POWER_ORDER);
const pad2 = n => String(n).padStart(2,'0');
const pw = k => `<span class="pw ${k}" aria-hidden="true"></span>`;
const visibleEvents = () => EVENTS.filter(e=>(calAll || e.major) && calFilter.has(e.power));
function eventsOn(iso){ return visibleEvents().filter(e=>e.date===iso).sort((a,b)=>POWER_ORDER.indexOf(a.power)-POWER_ORDER.indexOf(b.power)); }
function evHTML(e){
  const P = e.ref && PROJECTS[e.ref], sub = SUB_LABEL[e.house];
  const body = `<span class="id">${sub?esc(sub)+' · ':''}${esc(P ? P.code : (e.label||''))}</span><span class="t">${esc(P ? P.title : e.text)}</span>${P && e.text && e.text!=='Na pauta do Plenário' ? `<span class="w">${esc(e.text)}</span>` : ''}${e.result ? `<span class="r">${esc(e.result)}</span>` : ''}${e.week ? '<span class="tag">previsão para a semana</span>' : ''}`;
  return P ? `<a class="ev" href="#p-${e.ref}">${body}</a>` : `<div class="ev">${body}</div>`;
}
function groupedHTML(list){
  return POWER_ORDER.filter(k=>list.some(e=>e.power===k)).map(k=>`<section class="dd-house"><h4>${pw(k)}${POWER_LABEL[k]}</h4>${list.filter(e=>e.power===k).map(evHTML).join('')}</section>`).join('');
}
function dayHTML(iso){
  const [y,m,d] = iso.split('-').map(Number), wd = DIAS[new Date(y,m-1,d).getDay()];
  const list = eventsOn(iso);
  const head = `<p class="dd-date">${d} de ${MESES[m-1]}<span>${wd}, ${y}</span></p>`;
  if (!list.length){
    const next = [...new Set(visibleEvents().map(e=>e.date))].sort().find(x=>x>iso);
    return head + `<p class="dd-none">Nada registrado neste dia.</p>` + (next ? `<button class="dd-next" type="button" data-day="${next}">Próxima data: ${fmtDate(next)}</button>` : '');
  }
  return head + groupedHTML(list);
}
function monthGridHTML(today){
  const y = calYear, m = calMonth, first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  let cells = '';
  for (let i=0;i<first;i++) cells += '<span class="cv-d pad" aria-hidden="true"></span>';
  for (let d=1; d<=days; d++){
    const iso = `${y}-${pad2(m+1)}-${pad2(d)}`, list = eventsOn(iso);
    const cls = ['cv-d', list.length?'has':'', iso===today?'is-today':'', iso===calSel?'sel':'', iso<today?'past':''].filter(Boolean).join(' ');
    const marks = POWER_ORDER.map(k=>{ const n = list.filter(e=>e.power===k).length; return n ? `<span class="cv-m">${pw(k)}<b>${n}</b></span>` : ''; }).join('');
    const label = `${d} de ${MESES[m]}` + (list.length ? `: ${POWER_ORDER.map(k=>{ const n=list.filter(e=>e.power===k).length; return n?`${n} ${POWER_LABEL[k]}`:''; }).filter(Boolean).join(', ')}` : '');
    cells += list.length
      ? `<button type="button" class="${cls}" data-day="${iso}" aria-pressed="${iso===calSel}" aria-label="${label}"><span class="n">${d}</span><span class="cv-marks">${marks}</span></button>`
      : `<span class="${cls}"><span class="n">${d}</span></span>`;
  }
  return `<section class="cv-month" aria-label="${MESES[m]} de ${y}">
    <div class="cv-wk" aria-hidden="true"><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div>
    <div class="cv-grid">${cells}</div></section>`;
}
function monthListHTML(){
  const y = calYear, m = calMonth, pre = `${y}-${pad2(m+1)}-`;
  const dates = [...new Set(visibleEvents().filter(e=>e.date.startsWith(pre)).map(e=>e.date))].sort();
  if (!dates.length) return `<p class="dd-none cv-empty">Nada registrado em ${MESES[m]} de ${y}${calAll?'':' entre decisões e prazos'}.</p>`;
  const today = todayISO();
  return `<ol class="cv-list">${dates.map(iso=>{ const d = +iso.slice(8), wd = DIAS[new Date(y,m,d).getDay()];
    return `<li class="cv-day${iso===today?' is-today':''}${iso<today?' past':''}"><div class="cv-date"><b>${d}</b><span>${wd.replace('-feira','')}</span>${iso===today?'<em>hoje</em>':''}</div><div class="cv-items">${groupedHTML(eventsOn(iso))}</div></li>`; }).join('')}</ol>`;
}
function pendingHTML(){
  const today = todayISO();
  const rows = PENDING.flatMap(g=>g.items.map(([ref,note,dueLabel,due])=>({ref,note,dueLabel,due,power:POWER[g.where]||'cong',where:g.title}))).filter(r=>PROJECTS[r.ref] && calFilter.has(r.power));
  const dated = rows.filter(r=>r.due).sort((a,b)=>a.due.localeCompare(b.due)), undated = rows.filter(r=>!r.due);
  const row = r => { const P = PROJECTS[r.ref], last = P.steps.map(s=>s[0]).filter(d=>d<=today).sort().pop();
    const [yy,mm,dd] = (r.due||'').split('-').map(Number);
    return `<li><a class="wi" href="#p-${r.ref}">${r.due?`<span class="wi-due${r.due===today?' now':''}"><b>${r.due===today?'hoje':dd+' '+MES_AB[mm-1]}</b><span>${esc(r.dueLabel||'')}</span></span>`:''}<span class="wi-main"><span class="id">${pw(r.power)}${esc(r.where)} · ${esc(P.code)}</span><span class="t">${esc(P.title)}</span><span class="n">${esc(r.note)}</span>${last?`<span class="since">Última movimentação: ${fmtDate(last)}</span>`:''}</span></a></li>`; };
  return `<section class="wait" aria-labelledby="wait-title"><h2 id="wait-title">Em espera · ${rows.length}</h2>
    <p>O que ainda aguarda decisão, começando pelo que tem data mais próxima.</p>
    ${dated.length ? `<ul class="wait-list">${dated.map(row).join('')}</ul>` : ''}
    ${undated.length ? `<details class="wait-more"><summary>Sem data marcada · ${undated.length}</summary><ul class="wait-list">${undated.map(row).join('')}</ul></details>` : ''}
  </section>`;
}
const ARROW_L = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* calendar as an agenda of cards: today and the days ahead first, then the days before */
let calPast = 8;
function agendaCard(e){
  const P = e.ref && PROJECTS[e.ref];
  const where = [SUB_LABEL[e.house] || POWER_LABEL[e.power], e.time, e.week ? 'previsão para a semana' : (e.kind && e.fromAgenda ? e.kind.toLowerCase() : '')].filter(Boolean).join(' · ');
  const title = P ? `${esc(P.code)} · ${esc(P.title)}` : esc(e.label || e.text);
  const what = e.text && e.text!=='Na pauta do Plenário' && (P || e.label) ? e.text : '';
  const inner = `<span class="ag-where">${pw(e.power)}${esc(where)}</span><span class="ag-title">${title}</span>${what ? `<span class="ag-what">${esc(what)}</span>` : ''}${e.result ? `<span class="ag-res">→ ${esc(e.result)}</span>` : ''}`;
  return `<li>${P ? `<a class="ag-card" href="#p-${e.ref}">${inner}</a>` : `<div class="ag-card">${inner}</div>`}</li>`;
}
function agendaDay(iso, list, today){
  const [y,m,d] = iso.split('-').map(Number), wd = DIAS[new Date(y,m-1,d).getDay()].replace('-feira','');
  const week = list.length && list.every(e=>e.week);
  const top = iso===today ? 'hoje' : week ? 'semana' : wd;
  const sorted = list.slice().sort((a,b)=> (hm(a.time)??99*60)-(hm(b.time)??99*60) || POWER_ORDER.indexOf(a.power)-POWER_ORDER.indexOf(b.power));
  return `<li class="ag-day${iso===today?' is-today':''}${iso<today?' past':''}">
    <p class="ag-date"><span>${top}</span><b>${d}</b><span>${MES_AB[m-1]}${y!==+today.slice(0,4)?' '+y:''}</span></p>
    <ul class="ag-cards">${sorted.length ? sorted.map(agendaCard).join('') : '<li><p class="ag-empty">Nada marcado para hoje.</p></li>'}</ul></li>`;
}
function renderCal(keepScroll){
  const today = todayISO(), top = cal.scrollTop;
  const vis = visibleEvents();
  const by = {}; vis.forEach(e=>{ (by[e.date] = by[e.date] || []).push(e); });
  const dates = Object.keys(by).sort();
  const ahead = dates.filter(d=>d>today), before = dates.filter(d=>d<today).reverse();
  const shown = before.slice(0, calPast);
  cal.innerHTML = `<div class="cw ag">
    <header class="cw-head">
      <h1 id="cal-title">Calendário</h1>
      ${infoBox(CAL_SOURCES,'Fontes','As datas vêm das pautas do Plenário, das fichas de tramitação e dos atos publicados.')}
    </header>
    <div class="cv-bar">
      <div class="cv-chips" role="group" aria-label="Mostrar poderes">${POWER_ORDER.map(k=>`<button type="button" class="chip" data-pw="${k}" aria-pressed="${calFilter.has(k)}">${pw(k)}${POWER_LABEL[k]}</button>`).join('')}</div>
      <label class="cv-all"><input type="checkbox" id="cv-all" ${calAll?'checked':''}> Todas as etapas</label>
    </div>
    <section aria-labelledby="ag-next"><h2 class="ag-h" id="ag-next">Hoje e próximos dias</h2>
      <ol class="ag-days">${agendaDay(today, by[today]||[], today)}${ahead.map(d=>agendaDay(d, by[d], today)).join('')}</ol>
      ${ahead.length ? '' : '<p class="ag-empty">Nenhuma data marcada daqui para frente.</p>'}
    </section>
    ${before.length ? `<section aria-labelledby="ag-prev"><h2 class="ag-h" id="ag-prev">Dias anteriores</h2>
      <ol class="ag-days">${shown.map(d=>agendaDay(d, by[d], today)).join('')}</ol>
      ${before.length>shown.length ? `<button type="button" class="ag-more" data-more="1">Mostrar mais ${Math.min(8, before.length-shown.length)} dias</button>` : ''}
    </section>` : ''}
    ${pendingHTML()}
  </div>`;
  if (keepScroll) cal.scrollTop = top;
}
function selectDay(iso){
  const y = +iso.slice(0,4), m = +iso.slice(5,7)-1;
  calSel = iso;
  if (y!==calYear || m!==calMonth || calView!=='mes'){ calYear = y; calMonth = m; renderCal(true); }
  else {
    cal.querySelectorAll('.cv-d[data-day]').forEach(b=>{ const on = b.dataset.day===iso; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', String(on)); });
    cal.querySelector('#cal-day').innerHTML = dayHTML(iso);
  }
  if (matchMedia('(max-width:900px)').matches){ const dd = cal.querySelector('#cal-day'); dd && dd.scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'}); }
}
cal.addEventListener('click', e=>{
  const t = e.target;
  const yb = t.closest('[data-year]'); if (yb){ if (yb.dataset.year){ calYear = +yb.dataset.year; calSel = null; renderCal(true); } return; }
  const mb = t.closest('[data-month]'); if (mb){ calMonth = +mb.dataset.month; calSel = null; renderCal(true); return; }
  const ms = t.closest('[data-mstep]'); if (ms){ let m = calMonth + +ms.dataset.mstep, y = calYear; if (m<0){ m=11; y--; } if (m>11){ m=0; y++; } calMonth = m; calYear = y; calSel = null; renderCal(true); return; }
  const ch = t.closest('[data-pw]'); if (ch){ const k = ch.dataset.pw; if (calFilter.has(k) && calFilter.size>1) calFilter.delete(k); else calFilter.add(k); renderCal(true); return; }
  const vb = t.closest('[data-view]'); if (vb){ calView = vb.dataset.view; try { localStorage.setItem('plenario-calview', calView); } catch(err){} renderCal(true); return; }
  const mo = t.closest('[data-more]'); if (mo){ calPast += 8; renderCal(true); return; }
  const db = t.closest('[data-day]'); if (db){ selectDay(db.dataset.day); return; }
  if (t.closest('a[href^="#p-"]')) projFrom = true;
});
cal.addEventListener('change', e=>{ if (e.target.id==='cv-all'){ calAll = e.target.checked; renderCal(true); } });
function showCal(){
  if (!cal.hidden) return;
  calYear = null; calMonth = null; calSel = null; calPast = 8;
  renderCal(false);
  cal.scrollTop = 0;
  cal.hidden = false; requestAnimationFrame(()=>cal.classList.add('show'));
  document.title = 'Calendário · Quorum';
  cal.querySelector('#cal-title').setAttribute('tabindex','-1');
  cal.querySelector('#cal-title').focus({preventScroll:true});
}
function hideCal(){
  if (cal.hidden) return;
  cal.classList.remove('show'); cal.hidden = true; cal.innerHTML = '';
  document.title = 'Quorum';
}
function leaveCal(){ location.hash = ''; }

function showRoute(){
  // the calendar stays underneath while a project opened from it is on top
  if (location.hash === '#calendario') showCal();
  else if (!/^#p-/.test(location.hash)) hideCal();
  const m = location.hash.match(/^#p-([a-z0-9-]+)$/);
  if (m && renderProject(m[1])){
    if (proj.hidden){ projFocus = document.activeElement; proj.hidden = false; requestAnimationFrame(()=>proj.classList.add('show')); }
    proj.scrollTop = 0;
    document.title = PROJECTS[m[1]].code + ' · Quorum';
    proj.querySelector('.pj-title').setAttribute('tabindex','-1');
    proj.querySelector('.pj-title').focus({preventScroll:true});
  } else if (!proj.hidden){
    proj.classList.remove('show'); proj.hidden = true; proj.innerHTML = '';
    document.title = cal.hidden ? 'Quorum' : 'Calendário · Quorum';
    if (projFocus && projFocus.focus) projFocus.focus({preventScroll:true});
  }
}
function leaveProject(){
  if (projFrom){ projFrom = null; history.back(); }
  else { location.hash = ''; }
}
panel.addEventListener('click', e=>{ if (e.target.closest('.item-link')) projFrom = true; });
window.addEventListener('hashchange', showRoute);
showRoute();

// an outside click only closes an open sources box; it doesn't also act on what's underneath
document.addEventListener('click', e=>{
  let closed = false;
  document.querySelectorAll('details.info[open]').forEach(d=>{ if(!d.contains(e.target)){ d.open=false; closed=true; } });
  if (closed){ e.stopPropagation(); e.preventDefault(); }
}, true);
// click anywhere that isn't a seat closes the open view (person first, then house)
document.addEventListener('click', e=>{
  if (!proj.hidden || !cal.hidden || e.target.closest('.proj, .ov')) return;
  if (personState || partyState) return;
  if (!openKey) return;
  if (e.target.closest('.seat, .pres, .panel')) return;
  close();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const o=document.querySelector('details.info[open]'); if(o){ o.open=false; o.querySelector('summary').focus(); return; } goBack(); } });
